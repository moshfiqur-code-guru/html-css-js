<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Ecommerce | Home</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="assets/css/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="alert alert-dark text-center p-0 pb-1 rounded-0 alert-dismissible fade show mb-0">
    <span class="discount-offer-message">Get Up to 50% OFF New-Season Styles</span>
    <span class="badge text-bg-secondary rounded-0">MEN</span>
    <span class="badge text-bg-secondary rounded-0">WOMEN</span>
    <button class="btn-close px-3 py-2 small" data-bs-dismiss="alert"></button>
</div>
<section id="header-top">
    <nav class="navbar bg-primary navbar-expand-lg p-0">
        <div class="container">
            <div class="navbar-brand text-white p-0 d-flex align-items-center" href="#">
                <select class="form-select form-select-custom-size">
                    <option>USD</option>
                    <option>BDT</option>
                    <option>UAD</option>
                </select>
                <select class="form-select form-select-custom-size">
                    <option>EN</option>
                    <option>BN</option>
                    <option>FR</option>
                    <option>AR</option>
                </select>
            </div>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#headerTop">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="headerTop" class="collapse navbar-collapse">
                <div class="d-flex flex-grow-1 justify-content-between">
                    <div class="col-3 d-flex">

                    </div>
                    <div class="col-7">
                        <ul class="navbar-nav justify-content-center">
                            <li class="na-item"><a class="nav-link" href="#">BLOG</a></li>
                            <li class="nav-item"><a class="nav-link" href="#">SIGN IN</a></li>
                            <li class="nav-item"><a class="nav-link" href="#">CREATE ACCOUNT</a></li>
                        </ul>
                    </div>
                    <div class="col-2">
                        <ul class="navbar-nav justify-content-end">
                            <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-facebook"></i></a></li>
                            <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-twitter"></i></a></li>
                            <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-instagram"></i></a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</section>
<section id="header-bottom">
    <nav class="navbar bg-light navbar-expand-lg p-0">
        <div class="container">
            <a class="navbar-brand p-0 me-5" href="#"><img src="assets/images/logo.svg"/></a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#headerBottom">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="headerBottom" class="collapse navbar-collapse">
                <div class="d-flex flex-grow-1 justify-content-between align-items-center">
                    <div class="col-6">
                        <div class="input-group input-group-sm">
                            <input type="search" class="form-control"/>
                            <select class="form-select">
                                <option>ALL CATEGORY</option>
                                <option>MEN</option>
                                <option>WOMEN</option>
                                <option>FASHION</option>
                                <option>COSMETICS</option>
                            </select>
                            <span class="input-group-text" id="addon-wrapping"><i class="bi bi-search"></i></span>
                        </div>
                    </div>
                    <div class="col-3 justify-content-center d-flex">
                        <div class="d-flex align-items-center gap-2 call-us-now">
                            <i class="bi bi-telephone"></i>
                            <figure class="text-end mb-0">
                                <blockquote class="blockquote">
                                    <small>CALL US NOW</small>
                                </blockquote>
                                <figcaption class="blockquote-footer">
                                    <cite title="Source Title">+880173454656</cite>
                                </figcaption>
                            </figure>
                        </div>
                    </div>
                    <div class="col-3">
                        <ul class="navbar-nav justify-content-end">
                            <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-person"></i></a></li>
                            <li class="nav-item"><a class="nav-link position-relative" href="#">
                                <i class="bi bi-heart"></i>
                                <span class="badge bg-warning position-absolute top-5 start-50 rounded-pill">01</span>
                            </a></li>
                            <li class="nav-item"><a class="nav-link position-relative" href="#">
                                <i class="bi bi-cart"></i>
                                <span class="badge bg-primary position-absolute top-5 start-50 rounded-pill">01</span>
                            </a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</section>
<section id="offer-section" class="my-4">
    <div class="container">
        <div class="row  border">
            <div class="col d-flex align-items-center gap-3">
                <i class="bi bi-truck fs-2"></i>
                <figure>
                    <blockquote class="blockquote">
                        <p>FREE SHIPPING & RETURN</p>
                    </blockquote>
                    <figcaption class="blockquote-footer">
                        Free shipping on all order over $99
                    </figcaption>
                </figure>
            </div>
            <div class="col d-flex align-items-center gap-3">
                <i class="bi bi-currency-dollar fs-2"></i>
                <figure>
                    <blockquote class="blockquote">
                        <p>MONEY BACK GUARANTEE</p>
                    </blockquote>
                    <figcaption class="blockquote-footer">
                        100% money back guarantee
                    </figcaption>
                </figure>
            </div>
            <div class="col d-flex align-items-center gap-3">
                <i class="bi bi-person-raised-hand fs-2"></i>
                <figure>
                    <blockquote class="blockquote">
                        <p>ONLINE SUPPORT 24/7</p>
                    </blockquote>
                    <figcaption class="blockquote-footer">
                        100% money back guarantee
                    </figcaption>
                </figure>
            </div>
        </div>
    </div>
</section>
<section id="main">
    <div class="container">
        <div class="row">
            <div class="col-3 gx-0">
                <div class="category">
                    <ul class="list-group">
                        <li class="list-group-item list-group-item-action active mb-2 fs-6">BROWSE CATEGORY</li>
                    </ul>
                    <ul class="list-group">
                        <a href="#" class="list-group-item list-group-item-action">Men’s Clothing</a>
                        <a href="#" class="list-group-item list-group-item-action">Women’s
                            Clothing</a>
                        <a href="#" class="list-group-item list-group-item-action">Men’s
                            Clothing</a>
                        <a href="#" class="list-group-item list-group-item-action">Kids’s
                            Clothing</a>
                        <a href="#" class="list-group-item list-group-item-action">Shoes</a>

                        <a href="#" class="list-group-item list-group-item-action">Bags</a>

                        <a href="#"
                           class="list-group-item list-group-item-action">Watches</a>
                        <a href="#"
                           class="list-group-item list-group-item-action">Jewelry</a>
                        <a href="#" class="list-group-item list-group-item-action">Accessories</a>
                    </ul>
                </div>
            </div>
            <div class="col-9">
                <div class="main-content">
                    <div class="offer-slider">
                        <div id="offerSlider" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2500">
                            <div class="carousel-indicators">
                                <button type="button" data-bs-target="#offerSlider" data-bs-slide-to="0"
                                        class="active" aria-current="true" aria-label="Slide 1"></button>
                                <button type="button" data-bs-target="#offerSlider" data-bs-slide-to="1"
                                        aria-label="Slide 2"></button>
                                <button type="button" data-bs-target="#offerSlider" data-bs-slide-to="2"
                                        aria-label="Slide 3"></button>
                            </div>
                            <div class="carousel-inner">
                                <div class="carousel-item active">
                                    <img src="assets/images/slider/slider-1.png"/>
                                </div>
                                <div class="carousel-item">
                                    <img src="assets/images/slider/slider-2.png"/>
                                </div>
                                <div class="carousel-item">
                                    <img src="assets/images/slider/slider-3.png"/>
                                </div>
                            </div>
                            <button class="carousel-control-prev" data-bs-target="#offerSlider" data-bs-slide="prev">
                                <i class="carousel-control-prev-icon"></i>
                                <span class="visually-hidden">Previous</span>
                            </button>
                            <button class="carousel-control-next" data-bs-target="#offerSlider" data-bs-slide="next">
                                <i class="carousel-control-next-icon"></i>
                                <span class="visually-hidden">Next</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<script src="assets/js/popper.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>
</body>
</html>
