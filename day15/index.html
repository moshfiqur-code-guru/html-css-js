<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

<body>
<div class="form">

    <div id="content">
        <div id="login-form">
            <div id="error"></div>
            <div class="form-wrapper">
                <fieldset>
                    <legend>Please Login Here</legend>
                    <form method="post" onsubmit="doLogin()" name="login">
                        <div>
                            <label for="user-name">Username: </label>
                            <input type="text" name="username" id="user-name" placeholder="Username"/>
                        </div>
                        <div>
                            <label for="password">Password</label>
                            <div class="password-field">
                                <input type="password" id="user-password" placeholder="Enter password" name="password"
                                       id="password"/>
                                <div class="toggle">
                                    <div class="show" onclick="showPassword()">show</div>
                                    <div class="hide" onclick="hidePassword()">hide</div>
                                </div>
                            </div>

                        </div>

                        <div class="submit">
                            <div class="flex flex-center">
                                <input type="submit" value="Login"/>
                                <button onclick="clean()" type="button">Clear</button>
                            </div>
                            <p>Not yet registered? Please <a href="#">Registration</a> first</p>
                        </div>

                    </form>
                </fieldset>
            </div>
        </div>
