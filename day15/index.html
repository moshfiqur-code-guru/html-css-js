<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="assets/fontawesome/all.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <div class="form">

        <div id="content">
            <div id="login-form">
                <div id="error"></div>
                <div class="form-wrapper">
                    <fieldset>

                        <legend>Please Login Here</legend>
                        <form method="post" onsubmit="doLogin()" name="login">
                            <div>
                                <label for="user-name">Username: </label>
                                <div class="user-input relative">
                                    <div class="user-icon"><i class="fa-solid fa-user"></i></div>
                                    <input type="text" name="username" id="user-name" placeholder="Username" />
                                </div>
                            </div>
                            <div>
                                <label for="password">Password</label>
                                <div class="password-field">
                                    <div class="user-icon"><i class="fa-solid fa-lock"></i></div>
                                    <input type="password" id="user-password" placeholder="Enter password"
                                        name="password" id="password" />
                                    <div class="toggle">
                                        <div class="show" onclick="toggleVisible('text')"><i
                                                class="fa-solid fa-eye"></i>
                                        </div>
                                        <div class="hide" onclick="toggleVisible('password')"><i
                                                class="fa-solid fa-eye-slash"></i>
                                        </div>
                                    </div>
                                </div>

                            </div>

                            <div class="submit">
                                <div class="flex flex-center">
                                    <input type="submit" value="Login" />
                                    <!--                                <button onclick="clean()" type="button">Clear</button>-->
                                </div>
                                <p>Not yet registered? Please <a href="#">Registration</a> first</p>
                            </div>

                        </form>
                    </fieldset>
                </div>
            </div>

            <!--        <div class="text-center">-->
            <!--            <div>-->

            <!--                <button id="checkBtn">Even/Odd</button>-->
            <!--                <button id="checkPrimeBtn">Is Prime</button>-->
            <!--            </div>-->
            <!--        </div>-->

        </div>
    </div>

    <script src="assets/fontawesome/all.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
