          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

<div class="form">
    <fieldset>
        <legend>Please Register Here</legend>
        <form method="post" onsubmit="formSubmission()" name="register">
            <div>
                <label for="firstName">First Name: </label>
                <input type="text" name="firstName" id="firstName" placeholder="Enter first name"/>
            </div>
            <div>
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" placeholder="Enter last name" name="lastName"/>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email" name="email"/>
            </div>
            <div>
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="Enter username" name="username"/>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" name="password"/>
            </div>

            <div>
                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password" name="confirmpassword"/>
            </div>

            <div class="submit">
                <input type="submit" value="REGISTER"/>
                <button onclick="clean()">Clear</button>
            </div>

        </form>
    </fieldset>

</div>


<script src="script.js"></script>
</body>
